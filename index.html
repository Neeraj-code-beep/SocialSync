<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Metadata -->
    <title>CaptionAI — AI Social Media Caption Generator</title>
    <meta
      name="description"
      content="Turn your photos into ready-to-post social media captions with CaptionAI. Upload an image and generate engaging AI-powered captions in seconds."
    />
    <meta name="application-name" content="CaptionAI" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="CaptionAI" />
    <meta property="og:title" content="CaptionAI — AI Social Media Caption Generator" />
    <meta
      property="og:description"
      content="Turn your photos into engaging, ready-to-post social media captions in seconds with AI."
    />
    <meta property="og:type" content="website" />

    <!-- Twitter / X Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CaptionAI — AI Social Media Caption Generator" />
    <meta
      name="twitter:description"
      content="Turn your photos into engaging social media captions in seconds with AI."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FBFAF7] text-[#171717] antialiased font-sans min-h-screen overflow-x-hidden">
